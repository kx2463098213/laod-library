    <head>
        <meta charset="utf-8" />
        <title>财富宝库</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #76B852;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    
<style id="wealth-realm-theme-v1">
/* Fortune vault theme: decorative only; no authentication state selectors. */
:root{color-scheme:light;--realm-ink:#293f3b;--realm-paper:#f1e9d9}
html{min-height:100%;background:var(--realm-paper)}
body{margin:0!important;min-height:100svh;background:transparent!important;color:var(--realm-ink);font-family:"Songti SC","STSong","SimSun",serif!important}
#wealth-realm-scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#eee6d6}
#wealth-realm-scene .realm-art{width:100%;height:100%;object-fit:cover;object-position:50.8% 50%}
.realm-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(244,237,221,.22),transparent 22%,transparent 75%,rgba(32,48,43,.15))}
.realm-ring{position:absolute;left:50.8%;top:45%;width:max(26.3vw,46.8vh);aspect-ratio:1;border:2px solid rgba(188,151,75,.65);border-radius:50%;box-shadow:0 0 20px 4px rgba(217,179,91,.3),inset 0 0 16px 2px rgba(225,192,117,.24);animation:realm-ring 5.8s ease-in-out infinite}
.realm-mist{position:absolute;left:-20%;width:140%;height:20%;bottom:8%;background:radial-gradient(ellipse at 20% 60%,rgba(247,244,230,.72),transparent 55%),radial-gradient(ellipse at 72% 50%,rgba(250,247,235,.6),transparent 50%);opacity:.78;animation:realm-mist 17s ease-in-out infinite alternate}
.realm-mist.far{bottom:38%;height:17%;opacity:.5;animation-duration:24s;animation-direction:alternate-reverse}.realm-mist.front{bottom:-5%;height:24%;opacity:.7;animation-duration:20s;animation-delay:-12s}
.realm-spark{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;border-radius:50%;background:#d7a84e;box-shadow:0 0 7px rgba(222,185,103,.55);opacity:0;animation:realm-spark var(--dur) ease-in-out var(--delay) infinite}
#wealth-motion{position:fixed;z-index:20;right:28px;top:26px;cursor:pointer;border:1px solid #94a18e;border-radius:30px;background:rgba(250,247,235,.85);color:#344b43;padding:10px 14px;font:12px system-ui,sans-serif}
#wealth-motion:focus-visible{outline:2px solid #926c34;outline-offset:4px}

.staticrypt-page{width:100%!important;min-height:100svh;box-sizing:border-box;padding:100px 24px 48px!important;display:flex;align-items:center;justify-content:center}
.staticrypt-form{width:300px!important;max-width:100%!important;margin:0!important;padding:22px!important;box-sizing:border-box;background:radial-gradient(ellipse,rgba(249,242,222,.94),rgba(249,242,222,.76) 72%,rgba(249,242,222,.35))!important;border:1px solid rgba(154,133,87,.2);border-radius:3px;box-shadow:none!important}
.staticrypt-title{font-family:"Songti SC","STSong","SimSun",serif!important;color:#293f3b!important;font-weight:500!important;letter-spacing:.16em;font-size:30px!important}
.staticrypt-instructions{color:#536258!important;font-size:13px!important;line-height:1.6}
.staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:rgba(253,249,237,.9)!important;color:#334b42!important;border:1px solid #99a38a!important;box-sizing:border-box;min-height:44px}
.staticrypt-form input[type="submit"],.staticrypt-form button[type="submit"],.staticrypt-decrypt-button{background:#35554a!important;color:#fff6df!important;border:1px solid #60745a!important;min-height:44px;letter-spacing:.18em;cursor:pointer}
.staticrypt-form input:focus-visible,.staticrypt-form button:focus-visible{outline:2px solid #937440;outline-offset:3px}
.staticrypt-error{color:#842e20!important;background:rgba(255,246,230,.96);font-family:system-ui,sans-serif}
@keyframes realm-ring{0%,100%{opacity:.32;transform:translate(-50%,-50%) scale(.985)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.018)}}
@keyframes realm-mist{from{transform:translate(-10%,0)}to{transform:translate(11%,-16%)}}
@keyframes realm-spark{0%{opacity:0;transform:translate(-12px,30px)}18%,68%{opacity:.85}100%{opacity:0;transform:translate(22px,-90px)}}
@media(max-width:700px){#wealth-realm-scene{position:absolute;height:100%;min-height:100svh}.realm-art{position:absolute;top:50px;left:-25%;width:150%!important;height:auto!important;object-fit:contain!important}.realm-veil{background:linear-gradient(180deg,transparent 20%,#eee6d6 75%)}.realm-ring{top:calc(50px + 38vw);width:39.5vw}.realm-mist{bottom:auto;top:calc(50px + 39vw);height:18vw}.realm-mist.front{top:calc(50px + 58vw);height:22vw}.realm-mist.far{top:calc(50px + 22vw);height:16vw}.staticrypt-page{align-items:flex-start;padding:calc(68px + 65vw) 22px 32px!important}.staticrypt-form{width:330px!important}#wealth-motion{right:18px;top:18px;padding:9px 12px}body{position:relative;isolation:isolate}}
@media(prefers-reduced-motion:reduce){#wealth-realm-scene *{animation:none!important}.realm-ring{opacity:.45;transform:translate(-50%,-50%)}.realm-spark{opacity:.3}}
body{position:relative;isolation:isolate}.staticrypt-content{background:transparent!important;font-family:inherit!important;margin:0!important;padding:0!important;height:auto!important;min-height:100svh}.staticrypt-instructions{margin:0 0 20px!important}.staticrypt-title{margin:0!important}.staticrypt-hr{display:none}.wealth-password-label{display:block;text-align:left;font-size:12px;color:#485e50;margin:0 0 8px}.staticrypt-form input[type="submit"]{margin-bottom:0!important}

/* Script-free native checkbox pause, outside the authentication form. */
#wealth-motion-toggle{position:fixed;width:1px;height:1px;opacity:0;top:28px;right:30px;margin:0;padding:0;border:0}
#wealth-motion-toggle:focus-visible~#wealth-motion{outline:2px solid #926c34;outline-offset:4px}
#wealth-motion-toggle:checked~#wealth-realm-scene *{animation-play-state:paused!important}
#wealth-motion .motion-off{display:none}#wealth-motion-toggle:checked~#wealth-motion .motion-on{display:none}#wealth-motion-toggle:checked~#wealth-motion .motion-off{display:inline}

</style>

#staticrypt-password:focus-visible{outline:2px solid #937440;outline-offset:3px}

    <script id="wealth-ime-fix-v2">
/* Plain text area IME guard. Only checks for line breaks locally; never copies, stores, logs or transmits the secret. */
(() => {
  'use strict';
  const field = document.getElementById('staticrypt-password');
  const form = document.getElementById('staticrypt-form');
  if (!field || !form || field.tagName !== 'TEXTAREA') return;
  let composing = false;
  let imeKey = false;
  field.addEventListener('compositionstart', () => { composing = true; imeKey = true; });
  field.addEventListener('compositionend', () => { composing = false; });
  field.addEventListener('keydown', (event) => {
    imeKey = composing || event.isComposing || event.keyCode === 229;
    if (event.key === 'Enter' && !imeKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
  field.addEventListener('blur', () => { composing = false; imeKey = false; });
  form.addEventListener('pointerdown', () => { if (!composing) imeKey = false; });
  field.addEventListener('input', () => { field.setCustomValidity(''); });
  form.addEventListener('submit', (event) => {
    if (composing || imeKey) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if (/[\r\n]/.test(field.value)) {
      event.preventDefault();
      event.stopImmediatePropagation();
      field.setCustomValidity('密令不能包含换行，请删除换行后再启封。');
      field.reportValidity();
    }
  }, true);
})();
</script>
